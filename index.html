<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Awita</title>
</head>

<body class="bg-fondo">
    <div class="container text-white text-center mt-5">
        <h1 class="title">Awita</h1>
        <div class="progress my-4" style="height: 30px;">
            <div id="progressBar" class="progress-bar" style="width: 0%">0%</div>
        </div>

        <p><span id="current">0</span> / <span id="goal">8</span>vasos</p>

        <button id="drinkBtn" class="btn btn-primary btn-lg">Ya tome awita</button>
    </div>

    <div class="mb-3">
        <h2 class="my-3 text-center">Recordarme cada : </h2>
        <div class="btn-group w-100" role="group">
            <button class="btn btn-outline-primary interval-btn" data-minutes="30">
                30 minutos
            </button>

            <button class="btn btn-outline-primary interval-btn" data-minutes="45">
                45 minutos
            </button>

            <button class="btn btn-outline-primary interval-btn" data-minutes="60">
                60 minutos
            </button>
        </div>

        <h2 class="mt-3 text-center">
            Proximo recordatorio en : <strong id="countdown">--:--</strong>
        </h2>

    </div>

<script src="main.js"></script>
</body>
</html>
