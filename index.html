<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

    <title>Awita</title>
</head>

<body class="bg-fondo">

    <div class="app-wrapper">
        <div class="card-custom text-white text-center">
        <h1 class="title">Awita</h1>



      <div class="circle-container">
        <svg width="180" height="180">
            <circle
            cx="90"
            cy="90"
            r="70"
            class="circle-bg"/>
            <circle 
            cx="90"
            cy="90"
            r="70"
            class="circle-progress"
            id="circleProgress"/>
        </svg>
        <div class="circle-text">
            <span id="progressPercent">0%</span>
        </div>
      </div>



        <p><span id="current">0</span> / <span id="goal">8</span> vasos</p>

        <button id="drinkBtn" class="btn btn-primary btn-lg">
            Ya tomé awita
        </button>
    

    <div class="container text-white mt-5">

        <h2 class="my-3 text-center">Recordarme cada:</h2>

        <div class="btn-group w-100" role="group">
            <button class="btn btn-outline-primary interval-btn" data-minutes="30">
                30 minutos
            </button>

            <button class="btn btn-outline-primary interval-btn" data-minutes="45">
                45 minutos
            </button>

            <button class="btn btn-outline-primary interval-btn" data-minutes="60">
                60 minutos
            </button>
        </div>

        <h2 class="mt-4 text-center">
            Próximo recordatorio en: <strong id="countdown">--:--</strong>
        </h2>

        <div class="text-center mt-3">
            <button id="pauseBtn" class="btn btn-warning">
                ⏸️ Pausar
            </button>
        </div>

    </div>

    <div class="container mt-5">
        <h2 class="text-center text-white mb-3">Historial semanal</h2>
        <canvas id="weeklyChart"></canvas>
    </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="main.js"></script>

</body>
</html>
